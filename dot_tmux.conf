set -g @plugin tmux-plugins/tpm
set -g @plugin tmux-plugins/tmux-resurrect
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-processes 'irb pry "~rails server" "~rails console"'
run '~/.tmux/plugins/tpm/tpm'

set -g prefix C-t
unbind C-b

set -sg escape-time 1

bind r source-file ~/.tmux.conf \; display "Reloaded!"
bind C-t send-prefix

bind | split-window -h
bind - split-window -v

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

set -g default-terminal "screen-256color"

setw -g window-status-style fg=cyan,bg=default,dim
setw -g window-status-current-style fg=white,bg=red,bright

set -g pane-border-style fg=green,bg=black
set -g pane-active-border-style fg=white,bg=yellow

set -g message-style fg=white,bg=black,bright

setw -g monitor-activity on
set -g visual-activity on

set -g mode-keys vi
# Use clip.exe for WSL or xclip for Linux
if-shell 'grep -q WSL /proc/version' 'bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "clip.exe"' 'bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"'
if-shell 'grep -q WSL /proc/version' 'bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "clip.exe"' 'bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"'
bind-key -T copy-mode-vi v send-keys -X begin-selection
